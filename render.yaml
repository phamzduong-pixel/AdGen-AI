services:
  - type: web
    name: adgen-ai-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: DATABASE_URL
        fromDatabase:
          name: adgen-ai-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: AdGen AI
      - key: SMTP_USE_TLS
        value: "true"
      - key: PASSWORD_RESET_CODE_EXPIRE_MINUTES
        value: "10"
      - key: PASSWORD_RESET_RESEND_SECONDS
        value: "60"
      - key: PASSWORD_RESET_MAX_ATTEMPTS
        value: "5"
      - key: PASSWORD_RESET_EMAIL_HOURLY_LIMIT
        value: "5"
      - key: PASSWORD_RESET_IP_HOURLY_LIMIT
        value: "20"
      - key: EMAIL_VERIFICATION_EXPIRE_MINUTES
        value: "10"
      - key: EMAIL_VERIFICATION_RESEND_SECONDS
        value: "60"
      - key: EMAIL_VERIFICATION_MAX_ATTEMPTS
        value: "5"
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: adgen-ai-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: MAX_UPLOAD_SIZE
        value: "10485760"
      - key: ENVIRONMENT
        value: production

  - type: web
    name: adgen-ai-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: adgen-ai-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: adgen-ai-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    databaseName: adgen_ai
    user: adgen_ai
    ipAllowList: []
